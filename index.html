<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#070907">
<meta name="description" content="ATLAST — a coverage map of everywhere actually stood in, and a planning tool for everywhere not.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ATLAST — coverage</title>
<style>
:root{
 --bg:#070907; --ink:#eef2ea; --mut:#98a294; --dim:#5b6459; --faint:#3a423a;
 --a1:#a8cc70; --a2:#86a8c4; --gold:#e3c765; --white:#f2f6ee; --warn:#e0a06b;
 --line:rgba(238,242,234,.10); --line2:rgba(238,242,234,.055);
 --panel:rgba(11,14,11,.93);
 --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden;
 -webkit-text-size-adjust:100%;overscroll-behavior:none}
/* touch-action:none, or every drag on the map also scrolls and rubber-bands the page */
#c{position:fixed;inset:0;display:block;touch-action:none}

/* ── header ─────────────────────────────────────────────────────────── */
#top{position:fixed;top:0;left:0;right:0;z-index:10;padding:15px 20px;display:flex;gap:10px;
 align-items:center;background:linear-gradient(180deg,rgba(7,9,7,.92),transparent 92%);
 pointer-events:none}
#top h1{margin:0;font:700 16px/1 var(--mono);letter-spacing:.14em}
#top h1 .atl{color:var(--a1)}
#top h1 .t{color:var(--gold)}
.pill{font-family:var(--mono);font-size:8px;letter-spacing:.15em;text-transform:uppercase;
 border:1px solid var(--line);border-radius:20px;padding:3px 9px;color:var(--dim);white-space:nowrap}
.pill.on{color:var(--a1);border-color:rgba(168,204,112,.3)}
.pill.warn{color:var(--warn);border-color:rgba(224,160,107,.34)}
#sub{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--dim);margin-left:2px}
#back{pointer-events:auto;display:none;align-items:center;gap:2px;
 background:rgba(227,199,101,.1);border:1px solid rgba(227,199,101,.3);border-radius:20px;
 padding:3px 6px}
#back.on{display:inline-flex}
#back button{background:none;border:none;cursor:pointer;padding:3px 8px;border-radius:14px;
 font:600 9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
 transition:.14s}
#back button:hover{background:rgba(227,199,101,.2);color:#f6ecc2}
#back button.here{color:var(--ink);cursor:default}
#back button.here:hover{background:none;color:var(--ink)}
#back .sep{color:rgba(227,199,101,.45);font-size:10px;line-height:1}

/* ── drill-down wipe: the push-in between an overview and a region ───── */
#wipe{position:fixed;inset:0;z-index:13;pointer-events:none;opacity:0;
 transition:opacity .18s ease-out;
 background:radial-gradient(ellipse at 50% 45%,rgba(7,9,7,.35) 0%,rgba(7,9,7,.97) 72%)}
#wipe.on{opacity:1}

/* ── mode switch ────────────────────────────────────────────────────── */
#modes{position:fixed;top:12px;right:20px;z-index:14;display:flex;gap:4px}
#modes button{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;
 background:rgba(238,242,234,.04);color:var(--mut);border:1px solid var(--line);
 border-radius:20px;padding:7px 14px;cursor:pointer;transition:.15s}
#modes button:hover{color:var(--ink);border-color:rgba(238,242,234,.2)}
#modes button.on{background:rgba(168,204,112,.16);color:var(--ink);
 border-color:rgba(168,204,112,.38);box-shadow:0 0 0 3px rgba(168,204,112,.06)}
#modes button i{font-style:normal;opacity:.4;margin-left:6px}

/* ── stats + legend ─────────────────────────────────────────────────── */
#stats{position:fixed;left:20px;bottom:16px;z-index:11;display:flex;gap:24px;
 pointer-events:none;align-items:flex-end}
#stats div{font-family:var(--mono)}
#stats b{display:block;font-size:26px;font-weight:600;color:var(--a1);letter-spacing:-.03em;
 line-height:1;font-variant-numeric:tabular-nums}
#stats span{font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
#hint{position:fixed;right:20px;bottom:16px;z-index:11;font-family:var(--mono);font-size:8px;
 line-height:1.95;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);
 text-align:right;pointer-events:none}

/* ── hover callout: the only label on screen ────────────────────────── */
#tip{position:fixed;z-index:16;background:var(--panel);border:1px solid var(--line);
 border-left:2px solid var(--a1);border-radius:3px;padding:8px 12px;pointer-events:none;
 opacity:0;transition:opacity .09s;max-width:290px;
 box-shadow:0 10px 34px rgba(0,0,0,.6)}
#tip b{display:block;font:600 13px/1.25 ui-sans-serif,system-ui,sans-serif;color:var(--ink)}
#tip span{display:block;margin-top:3px;font:10px/1.4 var(--mono);letter-spacing:.06em;
 color:var(--mut);text-transform:lowercase}

/* ── the list panel ─────────────────────────────────────────────────────
   Beside the map, not under it. AllTrails' map view is criticised for having no list: tap a
   pin, a card appears at the bottom, tap again to open — two taps per candidate and no way to
   compare ten of them, which is what choosing actually requires. */
#panel{position:fixed;top:0;left:0;bottom:0;width:min(340px,86vw);z-index:12;
 display:flex;flex-direction:column;
 background:linear-gradient(90deg,rgba(7,9,7,.97),rgba(7,9,7,.88));
 border-right:1px solid var(--line);backdrop-filter:blur(14px);
 transform:translateX(-101%);transition:transform .22s cubic-bezier(.32,.72,0,1)}
#panel.open{transform:none}
#paneltog{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:13;
 background:rgba(7,9,7,.9);border:1px solid var(--line);border-left:none;
 border-radius:0 6px 6px 0;color:var(--mut);cursor:pointer;
 padding:16px 5px;font:600 9px var(--mono);letter-spacing:.16em;writing-mode:vertical-rl;
 text-transform:uppercase}
#paneltog:hover{color:var(--ink);background:rgba(168,204,112,.12)}
#panel.open + #paneltog{left:min(340px,86vw)}

.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;
 padding:calc(14px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.phcount{font:9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--a1)}
.phtog{background:none;border:1px solid var(--line);border-radius:20px;color:var(--mut);
 font:600 9px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;cursor:pointer}
.phtog.on{color:var(--gold);border-color:rgba(227,199,101,.4);background:rgba(227,199,101,.1)}

.psearch{padding:10px 14px 0}
.psearch input{width:100%;background:rgba(238,242,234,.05);border:1px solid var(--line);
 border-radius:4px;color:var(--ink);padding:8px 10px;font:13px ui-sans-serif,system-ui,sans-serif}
.psearch input:focus{outline:none;border-color:rgba(168,204,112,.45)}

.pchips{display:flex;flex-wrap:wrap;gap:4px;padding:10px 14px}
.pchip{display:inline-flex;align-items:center;gap:5px;background:rgba(238,242,234,.03);
 border:1px solid var(--line);border-radius:20px;color:var(--mut);cursor:pointer;
 padding:5px 9px;font:10.5px ui-sans-serif,system-ui,sans-serif;transition:.12s}
.pchip i{font-style:normal;opacity:.65;font-size:10px}
.pchip:hover{color:var(--ink);border-color:rgba(238,242,234,.22)}
.pchip.on{color:var(--ink);background:rgba(168,204,112,.16);border-color:rgba(168,204,112,.4)}
.pchip.on i{opacity:1;color:var(--a1)}

.pfacets{display:none;padding:4px 14px 12px;border-bottom:1px solid var(--line2)}
.pfacets.on{display:block}
.pfacet{display:grid;grid-template-columns:86px 1fr 70px;align-items:center;gap:8px;margin-bottom:8px}
.pfacet span{font:8.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.pfacet b{font:9px var(--mono);letter-spacing:.08em;color:var(--mut);text-align:right}
.pfacet input[type=range]{width:100%;accent-color:#a8cc70}
.pshow{display:flex;gap:4px;margin:10px 0 8px}
.pseg{flex:1;background:rgba(238,242,234,.03);border:1px solid var(--line);color:var(--mut);
 border-radius:4px;padding:6px;font:600 9px var(--mono);letter-spacing:.1em;
 text-transform:uppercase;cursor:pointer}
.pseg.on{color:var(--ink);background:rgba(168,204,112,.16);border-color:rgba(168,204,112,.38)}
.pclear{width:100%;background:none;border:none;color:var(--a2);font:10px var(--mono);
 letter-spacing:.08em;cursor:pointer;text-decoration:underline;padding:4px}

.pnext{padding:10px 14px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);
 background:rgba(168,204,112,.045)}
.pnexth{font:8.5px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--a1);
 margin-bottom:7px}
.pnextr{display:flex;flex-direction:column;gap:2px;padding:4px 0;border-radius:3px}
.pnextr.clickable{cursor:pointer}
.pnextr.clickable:hover{background:rgba(168,204,112,.1)}
.pnextwhy{font:11.5px/1.4 ui-sans-serif,system-ui,sans-serif;color:var(--mut)}
.pnextt{font:9px var(--mono);letter-spacing:.07em;color:var(--gold)}

.plist{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 0 24px}
.plist::-webkit-scrollbar{width:7px}
.plist::-webkit-scrollbar-thumb{background:rgba(238,242,234,.12);border-radius:7px}
.pempty{margin:16px 14px;font:11.5px/1.5 ui-sans-serif,system-ui,sans-serif;color:var(--dim)}

.prow2{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.prow2:hover{background:rgba(168,204,112,.06)}
.prow2.done{opacity:.55}
.prmain{flex:1;min-width:0}
.prtitle{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prname{font:500 12.5px ui-sans-serif,system-ui,sans-serif;color:var(--ink)}
.prmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;align-items:center}
.prbit{font:8.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.prbit.warn{color:var(--warn)}
.prbit.dim{opacity:.6}
.prwhy{margin:5px 0 0;font:11px/1.45 ui-sans-serif,system-ui,sans-serif;color:var(--dim);
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.practs{display:flex;align-items:flex-start}
.prdone{background:rgba(168,204,112,.1);border:1px solid rgba(168,204,112,.3);color:var(--a1);
 width:26px;height:26px;border-radius:4px;cursor:pointer;font-size:12px;line-height:1;flex:none}
.prdone:hover{background:rgba(168,204,112,.25)}

/* provenance — a surveyed coordinate and a blog recommendation must not look the same */
.prov{font:8px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:2px 5px;
 border-radius:3px;border:1px solid transparent;cursor:help}
.prov.fact{color:var(--a1);border-color:rgba(168,204,112,.3);background:rgba(168,204,112,.08)}
.prov.mine{color:var(--a2);border-color:rgba(134,168,196,.3);background:rgba(134,168,196,.08)}
.prov.edit{color:var(--gold);border-color:rgba(227,199,101,.28);background:rgba(227,199,101,.07)}

/* difficulty as two dimensions, because class and consequence are not the same thing */
.diffc{display:inline-flex;align-items:center;gap:3px;font:8.5px var(--mono);
 letter-spacing:.06em;text-transform:uppercase;color:var(--mut);cursor:help}
.diffc b{font-weight:600}
.diffc .exp{font-style:normal;letter-spacing:1px}
.diffc .exp.e1{color:#9ab87a}
.diffc .exp.e2{color:var(--warn)}
.diffc .exp.e3{color:#e06b6b}

@media (max-width:820px){
 #panel{width:100vw;transform:translateY(-101%)}
 #panel.open{transform:none}
 #panel.open + #paneltog{left:0;top:auto;bottom:calc(66px + env(safe-area-inset-bottom));
  transform:none;writing-mode:horizontal-tb;border-radius:6px;border-left:1px solid var(--line);
  padding:8px 12px}
 #paneltog{top:auto;bottom:calc(66px + env(safe-area-inset-bottom));transform:none;
  writing-mode:horizontal-tb;border-radius:0 6px 6px 0;padding:8px 12px}
 .psearch input,.prname{font-size:16px}
}

/* ── the card ───────────────────────────────────────────────────────── */
#cardhost{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);z-index:15;
 overflow-y:auto;overscroll-behavior:contain;
 transform:translateX(102%);transition:transform .22s cubic-bezier(.32,.72,0,1);
 background:linear-gradient(270deg,rgba(7,9,7,.97),rgba(7,9,7,.9));
 border-left:1px solid var(--line);backdrop-filter:blur(14px)}
#cardhost.open{transform:none}
#cardhost::-webkit-scrollbar{width:8px}
#cardhost::-webkit-scrollbar-thumb{background:rgba(238,242,234,.12);border-radius:8px}
.card{padding:0 0 40px}
.chead{position:sticky;top:0;z-index:2;display:flex;gap:13px;align-items:flex-start;
 padding:18px 18px 15px;background:rgba(7,9,7,.97);border-bottom:1px solid var(--line)}
.chead .ccode{font:700 15px/38px var(--mono);letter-spacing:.06em;width:44px;height:40px;
 text-align:center;flex:none;border:1px solid var(--line);border-radius:4px;color:var(--dim)}
.chead.on .ccode{color:var(--a1);border-color:rgba(168,204,112,.4);
 background:rgba(168,204,112,.08)}
.ctitle{flex:1;min-width:0}
.ctitle h2{margin:0;font:600 20px/1.15 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.02em}
.cstat{margin-top:4px;font:9px/1.5 var(--mono);letter-spacing:.15em;text-transform:uppercase;
 color:var(--dim)}
.cstat.on{color:var(--a1)}
.cstat i{display:block;font-style:normal;color:var(--faint);letter-spacing:.1em}
.chead .x{flex:none;background:none;border:1px solid var(--line);color:var(--mut);
 width:28px;height:28px;border-radius:4px;font-size:16px;line-height:1;cursor:pointer}
.chead .x:hover{color:var(--ink);border-color:rgba(238,242,234,.28)}

.csave{max-height:0;overflow:hidden;transition:max-height .2s;font:9px/26px var(--mono);
 letter-spacing:.14em;text-transform:uppercase;text-align:center}
.csave.show{max-height:26px}
.csave.live{background:rgba(168,204,112,.14);color:var(--a1)}
.csave.cached{background:rgba(224,160,107,.13);color:var(--warn)}

.cbody{padding:4px 18px 0}
.csec{padding:15px 0;border-bottom:1px solid var(--line2)}
.csech{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.csect{font:9px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.cseck{font:9px/1 var(--mono);letter-spacing:.1em;color:var(--faint)}
.cmut{margin:6px 0 0;font:11.5px/1.55 ui-sans-serif,system-ui,sans-serif;color:var(--dim)}

.bar{margin-bottom:10px}
.bar:last-child{margin-bottom:0}
.barh{display:flex;justify-content:space-between;align-items:baseline;
 font:10px/1.4 var(--mono);letter-spacing:.08em;color:var(--mut);margin-bottom:5px}
.barh b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.barh i{font-style:normal;color:var(--faint)}
.bart{height:3px;background:rgba(238,242,234,.07);border-radius:3px;overflow:hidden}
.barf{height:100%;border-radius:3px;transition:width .4s}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:11px/1 ui-sans-serif,system-ui,sans-serif;padding:6px 9px;border-radius:3px;
 border:1px solid var(--line);color:var(--mut);background:rgba(238,242,234,.02)}
.chip i{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;
 text-transform:uppercase;color:var(--faint);margin-left:6px}
.chip.on{color:var(--ink);border-color:rgba(168,204,112,.4);background:rgba(168,204,112,.11)}
.chip.on i{color:var(--a1)}
.chip.next{color:var(--ink);border-color:rgba(227,199,101,.38);background:rgba(227,199,101,.09)}
.chip.next i{color:var(--gold)}

.hp{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hp b{font:600 14px ui-sans-serif,system-ui,sans-serif}
.hp span{font:11px var(--mono);letter-spacing:.06em;color:var(--gold);
 font-variant-numeric:tabular-nums}

.route{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px}
.route b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
 white-space:nowrap}
.route span{font:9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.route .dot{width:6px;height:6px;border-radius:6px;flex:none;background:var(--gold)}
.route .dot.drive{background:#d9963f}
.route .dot.rail{background:var(--a2)}

.prow{display:flex;align-items:center;gap:10px}
.stars{display:flex;gap:3px}
.star{background:none;border:1px solid var(--line);color:var(--faint);width:30px;height:26px;
 border-radius:3px;cursor:pointer;font-size:10px;transition:.12s}
.star:hover{border-color:rgba(227,199,101,.4);color:var(--gold)}
.star.on{color:var(--gold);border-color:rgba(227,199,101,.45);background:rgba(227,199,101,.11)}
.phint{font:9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font:8.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.field input,.sv-keyrow input{background:rgba(238,242,234,.04);border:1px solid var(--line);
 border-radius:3px;color:var(--ink);padding:7px 8px;font:12px ui-sans-serif,system-ui,sans-serif}
.field input:focus,.sv-keyrow input:focus{outline:none;border-color:rgba(168,204,112,.45)}

.sv{margin-top:9px}
.sv iframe{width:100%;height:210px;border:1px solid var(--line);border-radius:4px;display:block}
.sv-sel{width:100%;background:rgba(238,242,234,.04);border:1px solid var(--line);
 border-radius:3px;color:var(--ink);padding:7px 8px;font:12px ui-sans-serif,system-ui,sans-serif}
.sv-key p{margin:0 0 8px;font-size:11.5px;line-height:1.55;color:var(--mut)}
.sv-keyrow{display:flex;gap:6px}
.sv-keyrow input{flex:1}
.sv-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.cbtn{background:rgba(168,204,112,.14);border:1px solid rgba(168,204,112,.36);color:var(--ink);
 border-radius:3px;padding:7px 12px;font:600 10px var(--mono);letter-spacing:.1em;
 text-transform:uppercase;cursor:pointer;white-space:nowrap}
.clink{background:none;border:none;color:var(--a2);font:10px var(--mono);letter-spacing:.08em;
 cursor:pointer;padding:0;text-decoration:underline}
.cfoot{padding:14px 0 0;font-size:11px;color:var(--dim);display:flex;gap:6px;flex-wrap:wrap;
 align-items:center}

/* ── boot + errors ──────────────────────────────────────────────────── */
#load{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:var(--bg);
 font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;
 color:var(--dim)}
#err{position:fixed;left:20px;top:62px;z-index:21;color:#e08b6b;font:11px var(--mono);
 max-width:70ch;white-space:pre-wrap;pointer-events:none}
/* ── phone ───────────────────────────────────────────────────────────────
   Same map, different furniture. The card becomes a bottom sheet, the mode switch moves to
   the bottom where a thumb actually is, and everything respects the notch. app.js reads the
   same 820px breakpoint to drop terrain resolution to something a phone GPU can carry. */
@media (max-width:820px){
 #top{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;gap:7px}
 #top h1{font-size:14px;letter-spacing:.12em}
 #top .pill.on:not(#src):not(#build){display:none}   /* "verified in person" — not on a phone */
 #sub{display:none}
 .pill{font-size:7.5px;padding:3px 7px}
 #back{padding:2px 4px}
 #back button{padding:4px 7px;font-size:8.5px}

 /* mode switch: bottom, thumb-height, out of the way of the notch */
 #modes{top:auto;bottom:calc(12px + env(safe-area-inset-bottom));left:14px;right:14px;
  justify-content:center;gap:6px}
 #modes button{flex:1;max-width:150px;padding:11px 10px;font-size:10px}
 #modes button i{display:none}

 #stats{left:14px;right:14px;bottom:calc(66px + env(safe-area-inset-bottom));gap:16px;
  overflow-x:auto;justify-content:space-between;padding-bottom:2px;
  pointer-events:auto;scrollbar-width:none}
 #stats::-webkit-scrollbar{display:none}
 #stats b{font-size:17px}
 #stats span{font-size:7px;letter-spacing:.1em}
 #hint{display:none}

 /* the card becomes a sheet */
 #cardhost{top:auto;left:0;right:0;bottom:0;width:100vw;height:72vh;
  border-left:none;border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  transform:translateY(102%);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -20px 60px rgba(0,0,0,.65)}
